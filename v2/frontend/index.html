<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klawiter — Stefan Zweig Bibliographie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.43/dist/flexsearch.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <h1 class="text-lg font-semibold whitespace-nowrap">
        <a href="#" class="hover:text-blue-700" id="home-link">Klawiter Bibliographie</a>
      </h1>
      <div class="flex-1 max-w-xl relative">
        <input type="search" id="search-input" placeholder="Suche in 4.751 Eintr&auml;gen..."
               class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span id="search-count" class="absolute right-3 top-2.5 text-xs text-gray-400"></span>
      </div>
      <button id="export-btn" class="text-sm text-gray-500 hover:text-blue-700 whitespace-nowrap" title="JSON-LD Export">
        Export
      </button>
    </div>
  </header>

  <!-- Active filters -->
  <div id="filter-chips" class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap gap-2 empty:hidden"></div>

  <!-- Main layout -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex gap-6">

    <!-- Sidebar: Facets -->
    <aside id="facets" class="w-64 shrink-0 hidden lg:block">
      <div id="facet-type" class="mb-6">
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-2">Typ</h3>
        <div id="facet-type-list" class="space-y-1"></div>
      </div>
      <div id="facet-language" class="mb-6">
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-2">Sprache</h3>
        <div id="facet-language-list" class="space-y-1"></div>
      </div>
      <div id="facet-period" class="mb-6">
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-2">Zeitraum</h3>
        <div id="facet-period-list" class="space-y-1"></div>
      </div>
      <div id="facet-location" class="mb-6">
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-2">Ort</h3>
        <div id="facet-location-list" class="space-y-1"></div>
      </div>
    </aside>

    <!-- Content area -->
    <div class="flex-1 min-w-0">
      <!-- Dashboard (shown when no search/filter active) -->
      <div id="dashboard" class="space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats-cards"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white rounded-lg border p-4">
            <h3 class="text-sm font-semibold text-gray-500 mb-3">Publikationen nach Jahr</h3>
            <canvas id="chart-timeline" height="200"></canvas>
          </div>
          <div class="bg-white rounded-lg border p-4">
            <h3 class="text-sm font-semibold text-gray-500 mb-3">Sprachen</h3>
            <canvas id="chart-languages" height="200"></canvas>
          </div>
        </div>
        <div class="bg-white rounded-lg border p-4">
          <h3 class="text-sm font-semibold text-gray-500 mb-3">Eintragstypen</h3>
          <canvas id="chart-types" height="120"></canvas>
        </div>
      </div>

      <!-- Results list -->
      <div id="results" class="hidden">
        <div id="results-header" class="flex items-center justify-between mb-4">
          <span id="results-count" class="text-sm text-gray-500"></span>
          <select id="sort-select" class="text-sm border rounded px-2 py-1">
            <option value="relevance">Relevanz</option>
            <option value="year-asc">Jahr aufsteigend</option>
            <option value="year-desc">Jahr absteigend</option>
            <option value="title">Titel A-Z</option>
          </select>
        </div>
        <div id="results-list" class="space-y-3"></div>
        <div id="load-more" class="text-center py-4 hidden">
          <button class="text-sm text-blue-600 hover:text-blue-800" id="load-more-btn">Mehr laden...</button>
        </div>
      </div>

      <!-- Detail view -->
      <div id="detail" class="hidden">
        <button id="back-btn" class="text-sm text-blue-600 hover:text-blue-800 mb-4">&larr; Zur&uuml;ck</button>
        <div id="detail-content" class="bg-white rounded-lg border p-6"></div>
      </div>
    </div>
  </main>

  <!-- Mobile filter toggle -->
  <button id="mobile-filter-btn"
          class="lg:hidden fixed bottom-4 right-4 bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg z-20">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
    </svg>
  </button>

  <!-- Mobile filter panel -->
  <div id="mobile-facets" class="fixed inset-0 bg-black/50 z-40 hidden">
    <div class="absolute right-0 top-0 bottom-0 w-80 bg-white p-4 overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold">Filter</h2>
        <button id="mobile-filter-close" class="text-gray-500">&times;</button>
      </div>
      <div id="mobile-facet-content"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/facets.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
