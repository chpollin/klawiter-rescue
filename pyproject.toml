[project]
name = "klawiter-rescue"
version = "1.0.0"
description = "Reproducible rescue, modeling, and publication pipeline for the Klawiter Bibliography"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "pydantic>=2.0",
  "pyshacl>=0.30",
  "rdflib>=7.0",
  "requests>=2.31",
]

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "docs/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
