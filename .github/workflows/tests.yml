name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast feedback against cached (or regenerated) stage intermediates.
  # Missing required inputs fail, including drift in the reviewed semantic oracle.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node runs the frontend-logic bridge (tests/test_frontend_logic.py
      # discovers every tests/*.test.js file and checks every docs/js/*.js).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          python -m uv sync --locked

      # Key over the stage code and the frozen LLM cache, not over data/raw
      # (363 MB that never change; hashing them costs more than it saves).
      - name: Restore stage intermediates
        id: cache-intermediates
        uses: actions/cache@v4
        with:
          path: data/intermediate
          key: intermediates-${{ hashFiles('pipeline/01_extract.py', 'pipeline/02_fix_encoding.py', 'pipeline/03_parse_entries.py', 'pipeline/03b_llm_enrich.py', 'pipeline/03c_normalize.py', 'pipeline/04_classify.py', 'pipeline/lib/config.py', 'pipeline/lib/encoding.py', 'pipeline/lib/patterns.py', 'pipeline/lib/wiki_parser.py', 'pipeline/lib/vocabulary.py', 'pipeline/lib/llm_extract.py', 'data/provenance/llm-enrichment-cache.json') }}

      - name: Regenerate stage intermediates
        if: steps.cache-intermediates.outputs.cache-hit != 'true'
        run: python -m uv run python pipeline/run_pipeline.py --to-stage 04 --no-postprocess

      - name: Run test suite
        run: python -m uv run python -m pytest -q --require-test-inputs --junitxml=test-results/default.xml

      # Known source/field mismatches stay red and visible in their own report.
      # The default gate rejects new, relocated or changed mismatch values.
      - name: Run semantic diagnostics
        continue-on-error: true
        run: python -m uv run python -m pytest -q -m semantic --require-test-inputs --junitxml=test-results/semantic.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      # Same hook set developers install locally (pre-commit install); one
      # definition of the static checks in .pre-commit-config.yaml.
      - name: Run static checks (pre-commit)
        run: python -m uv run pre-commit run --all-files --show-diff-on-failure

  # Authoritative reproduction: rebuild everything from the committed raw
  # sources, run both gate validators, and prove the committed deterministic
  # artifacts are byte-identical. A forgotten re-freeze is a build failure.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          python -m uv sync --locked

      - name: Full deterministic pipeline run
        run: python -m uv run python pipeline/run_pipeline.py

      # HEAD preserves the reviewed reference even after the runner rewrites
      # manifests. This also checks ignored Gate-2 candidates and review queues.
      - name: Reviewed gate evidence reproduction check
        run: python -m uv run python pipeline/verify_committed_evidence.py

      # Manifests are compared above except for generatedAt and the hashes of
      # timestamped EARL, provenance and validation reports. These explicit
      # tracked deterministic paths additionally require byte identity.
      # docs/vocab/ joined the set once the
      # register lost its case collisions (2026-08-27), so the term
      # directories are identical on Linux and Windows.
      - name: Deterministic artifact reproduction check
        run: |
          git diff --exit-code -- \
            docs/vocab/ \
            data/output/klawiter.jsonld \
            data/output/quality-report.json \
            data/output/census-report.json \
            data/output/verification-report.json \
            data/output/editions/work-editions.jsonld \
            data/output/editions/review-queue.json \
            data/output/reconciliation/decisions.json \
            data/output/reconciliation/publishable-links.json \
            data/output/reconciliation/contested-claims.json \
            docs/data/klawiter.json \
            docs/data/reconciliation.json \
            docs/data/triage.json
