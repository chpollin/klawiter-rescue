name: Validate Curation Patch

on:
  pull_request:
    paths:
      - 'data/corrections/**'
      - 'docs/data/klawiter.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          python -m uv sync --locked

      # Reuses pipeline/apply_patches.validate_patch so CI and the overlay
      # step can never drift apart on what a valid patch is.
      - name: Validate correction patches
        run: |
          python -m uv run python - <<'EOF'
          import glob, json, sys
          from pathlib import Path
          sys.path.insert(0, 'pipeline')
          from apply_patches import field_patches, validate_patch
          from lib.reconciliation import load_reconciliation_patches
          errors = []
          files = sorted(glob.glob('data/corrections/*.json'))
          if not files:
              print('No correction files — empty store is valid')
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  doc = json.load(fh)
              try:
                  patches = field_patches(doc)
              except ValueError as exc:
                  errors.append(f'{path}: {exc}')
                  continue
              for p in patches:
                  for problem in validate_patch(p):
                      errors.append(f'{path}: {problem}')
              print(f'{path}: {len(patches)} patch(es) checked')
          reconciliation = load_reconciliation_patches(Path('data/corrections'))
          print(
              'Reconciliation decisions: '
              f"{len(reconciliation['location'])} location, "
              f"{len(reconciliation['work'])} work"
          )
          if errors:
              print('\n'.join('FAIL: ' + e for e in errors))
              sys.exit(1)
          EOF

      - name: Validate frontend JSON integrity
        run: |
          python - <<'EOF'
          import json
          with open('docs/data/klawiter.json') as f:
              data = json.load(f)
          entries = data.get('entries', [])
          assert entries, 'No entries in frontend JSON'
          print(f'Entries: {len(entries)}')
          for e in entries:
              assert 'sourcePageId' in e, 'Missing sourcePageId'
              assert 'entryType' in e, f"Missing entryType in {e.get('sourcePageId')}"
          print('All entries valid')
          EOF

      # The regression suite compares against .github/baseline-metrics.json;
      # thresholds live there and in the tests, not duplicated here.
      - name: Run regression tests
        if: hashFiles('data/output/quality-report.json') != ''
        run: python -m uv run python -m pytest tests/test_regression.py -v

      - name: Report coverage changes
        run: |
          python - <<'EOF'
          import json
          with open('docs/data/klawiter.json') as f:
              data = json.load(f)
          entries = [e for e in data['entries'] if e.get('pageNamespace') == 0]
          total = len(entries)
          for field in ['publisher', 'location', 'translator', 'pageCount']:
              count = sum(1 for e in entries if e.get(field))
              prov = {}
              for e in entries:
                  p = (e.get('_provenance') or {}).get(field, 'unknown')
                  prov[p] = prov.get(p, 0) + 1
              print(f'{field}: {count}/{total} ({100*count/total:.1f}%) — {prov}')
          EOF
