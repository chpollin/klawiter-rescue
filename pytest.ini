[pytest]
testpaths = tests
pythonpath = pipeline
# Semantic ground-truth tests are red by design (documented fidelity gap,
# see knowledge/testing.md). The default gate checks exact known page/field/
# value deviations in test_semantic.py::test_ground_truth_mismatches_bounded.
# CLI -m overrides these defaults, e.g. `pytest -m semantic`.
addopts = --strict-markers --strict-config -ra -m "not semantic"
markers =
    semantic: wiki-verified per-field diagnosis, red by design (deselected by default, run with '-m semantic')
