[pytest]
testpaths = tests
pythonpath = pipeline
# LLM tests cost API calls; a bare `pytest` must never spend money.
# Semantic ground-truth tests are red by design (documented fidelity gap,
# see knowledge/testing.md category F) — diagnosis, not a gate; the bound
# lives in test_semantic.py::test_ground_truth_mismatches_bounded.
# CLI -m overrides these defaults, e.g. `pytest -m llm`.
addopts = -m "not llm and not semantic"
markers =
    llm: tests that require Gemini API access (deselected by default, run with '-m llm')
    semantic: wiki-verified per-field diagnosis, red by design (deselected by default, run with '-m semantic')
