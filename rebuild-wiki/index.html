<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zweig Bibliography Wiki Dashboard</title>
    <!-- Tailwind CDN (compile-time "tw" to avoid FOUC) -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>

    <style>
      /* Academic serif heading style */
      h1, h2, h3, h4 {
        @apply font-serif;
      }
      /* Force focus outlines for accessibility */
      :focus-visible {
        outline: 2px solid black;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900">
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center gap-4">
        <h1 class="text-3xl font-serif flex-1">Zweig Bibliography Wiki Dashboard</h1>

        <!-- Search with typeahead -->
        <div class="relative w-full sm:w-96">
          <label for="search" class="sr-only">Search bibliography</label>
          <input id="search" type="search" role="combobox" aria-controls="suggestions" aria-expanded="false" placeholder="Search… (title, publisher, full text…)" class="w-full border-gray-300 rounded-lg py-2 pl-3 pr-10 shadow focus:ring focus:ring-indigo-300" />
          <!-- suggestions -->
          <ul id="suggestions" class="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-md shadow-lg max-h-60 overflow-auto hidden" role="listbox"></ul>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="grid lg:grid-cols-[18rem_1fr] gap-4 max-w-7xl mx-auto p-4">
      <!-- Sidebar: Category tree & filters -->
      <aside aria-label="Filters & categories" class="space-y-6">
        <!-- Category tree -->
        <section>
          <h2 class="text-xl mb-2 font-semibold">Categories</h2>
          <nav id="category-tree" class="text-sm overflow-y-auto max-h-[60vh] pr-2"></nav>
        </section>

        <!-- Facets -->
        <section>
          <h2 class="text-xl mb-2 font-semibold">Facets</h2>
          <div id="facets" class="space-y-4 text-sm"></div>
        </section>

        <!-- Active filters chips -->
        <div id="active-filters" class="flex flex-wrap gap-2"></div>
      </aside>

      <!-- Results & Visualisations -->
      <section class="space-y-8">
        <!-- Result statistics -->
        <div id="stats" class="text-sm text-gray-600"></div>

        <!-- Results list -->
        <ol id="results-list" class="space-y-6"></ol>

        <!-- Visualisation Tabs -->
        <div>
          <h2 class="text-xl mb-4 font-semibold">Visualisations</h2>
          <div role="tablist" aria-label="Visualisation Tabs" class="flex gap-4 border-b">
            <button data-tab="timeline" class="px-3 pb-2 border-b-2 border-transparent focus:outline-none">Timeline</button>
            <button data-tab="distribution" class="px-3 pb-2 border-b-2 border-transparent focus:outline-none">Distributions</button>
            <button data-tab="network" class="px-3 pb-2 border-b-2 border-transparent focus:outline-none">Network</button>
          </div>
          <div class="mt-4">
            <canvas id="timeline-chart" class="hidden" aria-label="Timeline Chart" role="img"></canvas>
            <canvas id="distribution-chart" class="hidden" aria-label="Distribution Chart" role="img"></canvas>
            <svg id="network-graph" class="hidden w-full h-96 border rounded" aria-label="Network Graph"></svg>
          </div>
        </div>
      </section>
    </main>

    <!-- Entry modal -->
    <div id="entry-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center backdrop-blur-sm hidden" role="dialog" aria-modal="true">
      <div class="bg-white max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 rounded-lg shadow-lg">
        <button id="close-modal" class="absolute top-2 right-2 text-gray-600 hover:text-gray-900" aria-label="Close">&times;</button>
        <article id="entry-content" class="prose max-w-none"></article>
      </div>
    </div>

    <!-- Application Script -->
    <script type="module">
      // Global state
      const state = {
        entries: [], // full dataset
        index: null, // FlexSearch index
        tree: {}, // category hierarchy
        activeFilters: {},
        searchTerm: '',
        results: [],
      };

      /** UTILITIES **/
      const qs = (s, el = document) => el.querySelector(s);
      const qsa = (s, el = document) => Array.from(el.querySelectorAll(s));
      const slugify = str => str?.toLowerCase().replace(/[^a-z0-9]+/g, '-') ?? '';

      // Parse CSV and initialise app
      async function init() {
        const csvURL = 'zweig_bibliography_enhanced.csv';
        const response = await fetch(csvURL);
        const text = await response.text();
        const { data } = Papa.parse(text, { header: true, skipEmptyLines: true });
        state.entries = data;
        buildSearchIndex();
        buildCategoryTree();
        applyFiltersAndSearch();
        restoreStateFromURL();
      }

      // Build FlexSearch index
      function buildSearchIndex() {
        const { Document } = window.FlexSearch;
        state.index = new Document({
          cache: 1000,
          encode: 'icase',
          tokenize: 'forward',
          document: {
            id: 'page_id',
            index: [
              'title',
              'original_title',
              'publisher',
              'location',
              'language',
              'categories',
              'main_category',
              'clean_content',
              'full_bibliographic_entry'
            ],
          },
        });
        state.entries.forEach(e => state.index.add(e));
      }

      // Build hierarchical category tree
      function buildCategoryTree() {
        state.tree = {};
        state.entries.forEach(entry => {
          const cats = entry.categories?.split('>') || [];
          let node = state.tree;
          cats.forEach(cat => {
            cat = cat.trim();
            if (!cat) return;
            node[cat] = node[cat] || { __count: 0, __children: {} };
            node[cat].__count += 1;
            node = node[cat].__children;
          });
        });
        renderCategoryTree();
      }

      // Render category nav using recursive details/summary for accessibility
      function renderCategoryTree() {
        const container = qs('#category-tree');
        container.innerHTML = createTreeHTML(state.tree);
        // Attach click handlers
        qsa('button[data-cat]', container).forEach(btn =>
          btn.addEventListener('click', () => {
            const cat = btn.dataset.cat;
            state.activeFilters.categories = cat;
            applyFiltersAndSearch();
          })
        );
      }

      function createTreeHTML(node) {
        return '<ul class="pl-4 space-y-1">' +
          Object.entries(node).map(([name, data]) => {
            const slug = slugify(name);
            const hasChildren = Object.keys(data.__children).length > 0;
            return `<li>
              ${hasChildren ? `<details open>
                <summary class="cursor-pointer">
                  <button data-cat="${name}" class="hover:underline">${name} <span class="text-gray-500">(${data.__count})</span></button>
                </summary>
                ${createTreeHTML(data.__children)}
              </details>` : `<button data-cat="${name}" class="hover:underline">${name} <span class="text-gray-500">(${data.__count})</span></button>`}
            </li>`;
          }).join('') + '</ul>';
      }

      // Search & filter pipeline
      function applyFiltersAndSearch() {
        const term = state.searchTerm;
        let results = [];
        if (term) {
          const matches = state.index.search(term, { enrich: true, limit: 100 });
          // Flatten results while maintaining original order relevance from flexsearch
          const idSet = new Set();
          matches.forEach(m => m.result.forEach(r => idSet.add(r)));
          results = state.entries.filter(e => idSet.has(e.page_id));
        } else {
          results = [...state.entries];
        }

        // Apply active filters
        results = results.filter(entry => {
          for (const [field, value] of Object.entries(state.activeFilters)) {
            if (!value) continue;
            if (field === 'year_range') {
              const [min, max] = value;
              const year = parseInt(entry.year);
              if (year < min || year > max) return false;
            } else if (field === 'categories') {
              if (!entry.categories?.includes(value)) return false;
            } else if (Array.isArray(value)) {
              if (!value.includes(entry[field])) return false;
            } else {
              if (entry[field] !== value) return false;
            }
          }
          return true;
        });

        state.results = results;
        renderStats();
        renderResults();
        renderFacets();
        updateURL();
        drawTimeline();
        drawDistribution();
        drawNetwork();
      }

      // Render search statistics
      function renderStats() {
        qs('#stats').textContent = `${state.results.length} entries found` + (state.searchTerm ? ` for “${state.searchTerm}”` : '');
      }

      // Render result list
      function renderResults() {
        const list = qs('#results-list');
        list.innerHTML = state.results.map(entry => {
          const highlight = (field) => {
            if (!state.searchTerm) return entry[field];
            return entry[field]?.replace(new RegExp(`(${state.searchTerm})`, 'gi'), '<mark>$1</mark>');
          };
          return `<li class="bg-white p-4 shadow rounded-lg" id="entry-${entry.page_id}">
            <h3 class="text-lg font-semibold cursor-pointer hover:underline" data-open="${entry.page_id}">${highlight('title') || 'Untitled'}</h3>
            <p class="text-sm text-gray-600">${highlight('publisher') || ''} ${entry.year ? '(' + entry.year + ')' : ''}</p>
            <p class="text-sm mt-1 line-clamp-2">${highlight('clean_content') || ''}</p>
          </li>`;
        }).join('');

        // Attach modal open
        qsa('[data-open]', list).forEach(el => el.addEventListener('click', () => openEntryModal(el.dataset.open)));
      }

      // Modal display with tabbed view
      function openEntryModal(pageId) {
        const entry = state.entries.find(e => e.page_id === pageId);
        const article = qs('#entry-content');
        article.innerHTML = `
          <h2 class="font-serif text-2xl mb-2">${entry.title || 'Untitled'}</h2>
          <p class="italic mb-4">${entry.original_title || ''}</p>

          <div class="border-b mb-4 flex gap-4" role="tablist">
            <button class="px-3 pb-2 border-b-2 border-transparent" data-tab="bib">Bibliographic</button>
            <button class="px-3 pb-2 border-b-2 border-transparent" data-tab="content">Content</button>
            <button class="px-3 pb-2 border-b-2 border-transparent" data-tab="related">Related</button>
          </div>
          <div data-pane="bib">
            <p><strong>Publisher:</strong> ${entry.publisher || '—'}</p>
            <p><strong>Location:</strong> ${entry.location || '—'}</p>
            <p><strong>Year:</strong> ${entry.year || '—'}</p>
            <p><strong>Language:</strong> ${entry.language || '—'}</p>
            <p class="mt-2 whitespace-pre-wrap">${entry.full_bibliographic_entry || ''}</p>
          </div>
          <div data-pane="content" class="hidden whitespace-pre-wrap">${entry.clean_content || ''}</div>
          <div data-pane="related" class="hidden">Loading related entries…</div>
        `;
        // Tab switching
        qsa('[data-tab]', article).forEach(btn => btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          qsa('[data-tab]', article).forEach(b => b.classList.toggle('border-indigo-600', b === btn));
          qsa('[data-pane]', article).forEach(p => p.classList.toggle('hidden', p.dataset.pane !== tab));
          if (tab === 'related') loadRelatedEntries(entry);
        }));
        // Default activate first tab
        qs('[data-tab="bib"]', article).click();
        qs('#entry-modal').classList.remove('hidden');
      }

      qs('#close-modal').addEventListener('click', () => qs('#entry-modal').classList.add('hidden'));
      qs('#entry-modal').addEventListener('click', e => { if (e.target === qs('#entry-modal')) qs('#entry-modal').classList.add('hidden'); });

      // Load related entries by text_id
      function loadRelatedEntries(entry) {
        const related = state.entries.filter(e => e.text_id === entry.text_id && e.page_id !== entry.page_id);
        const container = qs('[data-pane="related"]');
        container.innerHTML = related.length ? '<ul class="list-disc pl-6 space-y-1">' + related.map(r => `<li><a href="#entry-${r.page_id}" class="underline" data-open="${r.page_id}">${r.title}</a></li>`).join('') + '</ul>' : '<p>No related entries.</p>';
        qsa('[data-open]', container).forEach(el => el.addEventListener('click', () => openEntryModal(el.dataset.open)));
      }

      /** Facets **/
      function renderFacets() {
        const container = qs('#facets');
        const fields = ['language', 'publisher'];
        container.innerHTML = fields.map(field => {
          const counts = {};
          state.results.forEach(e => {
            const v = e[field] || 'Unknown';
            counts[v] = (counts[v] || 0) + 1;
          });
          const options = Object.entries(counts).sort((a, b) => b[1] - a[1]);
          return `<details open>
            <summary class="font-medium cursor-pointer">${field.charAt(0).toUpperCase() + field.slice(1)}</summary>
            <ul class="pl-4 space-y-1">
              ${options.slice(0, 20).map(([val, count]) => {
                const checked = state.activeFilters[field]?.includes?.(val) ? 'checked' : '';
                const id = `${field}-${slugify(val)}`;
                return `<li><label class="inline-flex items-center gap-1"><input type="checkbox" id="${id}" data-field="${field}" data-value="${val}" ${checked} class="peer"> <span>${val} (${count})</span></label></li>`;
              }).join('')}
            </ul>
          </details>`;
        }).join('');

        // Event listeners
        qsa('input[type="checkbox"][data-field]', container).forEach(cb => cb.addEventListener('change', () => {
          const { field, value } = cb.dataset;
          state.activeFilters[field] = state.activeFilters[field] || [];
          if (cb.checked) {
            state.activeFilters[field].push(value);
          } else {
            state.activeFilters[field] = state.activeFilters[field].filter(v => v !== value);
            if (!state.activeFilters[field].length) delete state.activeFilters[field];
          }
          applyFiltersAndSearch();
        }));
      }

      /** Visualisations **/
      let timelineChart, distributionChart;
      function drawTimeline() {
        const canvas = qs('#timeline-chart');
        const tabBtn = qs('[data-tab="timeline"]');
        if (!timelineChart) {
          timelineChart = new Chart(canvas, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Publications', data: [] }] },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false }}, scales: { x: { title: { text: 'Year', display: true } }, y: { title: { text: 'Count', display: true } } } }
          });
        }
        const yearCounts = {};
        state.results.forEach(e => { const y = e.year || 'Unknown'; yearCounts[y] = (yearCounts[y] || 0) + 1; });
        const years = Object.keys(yearCounts).sort();
        timelineChart.data.labels = years;
        timelineChart.data.datasets[0].data = years.map(y => yearCounts[y]);
        timelineChart.update();
      }

      function drawDistribution() {
        const canvas = qs('#distribution-chart');
        if (!distributionChart) {
          distributionChart = new Chart(canvas, {
            type: 'pie',
            data: { labels: [], datasets: [{ data: [] }] },
            options: { maintainAspectRatio: false }
          });
        }
        const langCounts = {};
        state.results.forEach(e => { const l = e.language || 'Unknown'; langCounts[l] = (langCounts[l] || 0) + 1; });
        const langs = Object.keys(langCounts);
        distributionChart.data.labels = langs;
        distributionChart.data.datasets[0].data = langs.map(l => langCounts[l]);
        distributionChart.update();
      }

      function drawNetwork() {
        const svg = d3.select('#network-graph');
        const nodes = state.results.slice(0, 100).map(e => ({ id: e.page_id, group: e.main_category }));
        const links = [];
        // simple link: shared category
        const byCategory = {};
        nodes.forEach(n => {
          byCategory[n.group] = byCategory[n.group] || [];
          byCategory[n.group].push(n);
        });
        Object.values(byCategory).forEach(arr => {
          for (let i = 0; i < arr.length - 1; i++) links.push({ source: arr[i].id, target: arr[i + 1].id });
        });
        svg.selectAll('*').remove();
        const width = svg.node().clientWidth;
        const height = svg.node().clientHeight;
        const simulation = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(d => d.id).distance(50))
          .force('charge', d3.forceManyBody().strength(-30))
          .force('center', d3.forceCenter(width / 2, height / 2));

        const link = svg.append('g').attr('stroke', '#999').attr('stroke-opacity', 0.6)
          .selectAll('line').data(links).enter().append('line').attr('stroke-width', 1);
        const node = svg.append('g').attr('stroke', '#fff').attr('stroke-width', 1.5)
          .selectAll('circle').data(nodes).enter().append('circle').attr('r', 4).attr('fill', '#1e3a8a').call(drag(simulation));
        node.append('title').text(d => d.id);
        simulation.on('tick', () => {
          link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
              .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
          node.attr('cx', d => d.x).attr('cy', d => d.y);
        });
        function drag(sim) {
          function dragstarted(event) { if (!event.active) sim.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
          function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
          function dragended(event) { if (!event.active) sim.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }
          return d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended);
        }
      }

      /** URL state **/
      function updateURL() {
        const params = new URLSearchParams();
        if (state.searchTerm) params.set('q', state.searchTerm);
        if (Object.keys(state.activeFilters).length) params.set('f', btoa(JSON.stringify(state.activeFilters)));
        history.replaceState(null, '', params.toString() ? '?' + params.toString() : location.pathname);
      }

      function restoreStateFromURL() {
        const params = new URLSearchParams(location.search);
        if (params.has('q')) {
          state.searchTerm = params.get('q');
          qs('#search').value = state.searchTerm;
        }
        if (params.has('f')) {
          try { state.activeFilters = JSON.parse(atob(params.get('f'))); } catch {}
        }
        applyFiltersAndSearch();
      }

      /** LocalStorage preferences placeholder (e.g., dark mode) **/
      // TODO: implement preference saving/loading

      /** Event listeners **/
      const searchInput = qs('#search');
      searchInput.addEventListener('input', (e) => {
        state.searchTerm = e.target.value.trim();
        showTypeahead(state.searchTerm);
        applyFiltersAndSearch();
      });

      // Typeahead suggestions
      function showTypeahead(term) {
        const list = qs('#suggestions');
        if (term.length < 2) { list.hidden = true; return; }
        const matches = state.index.search(term, { limit: 5, field: 'title' })[0]?.result || [];
        const suggestions = matches.map(id => state.entries.find(e => e.page_id === id)?.title).filter(Boolean);
        list.innerHTML = suggestions.map(s => `<li role="option" class="px-3 py-1 hover:bg-indigo-50 cursor-pointer">${s}</li>`).join('');
        list.hidden = !suggestions.length;
        qsa('li', list).forEach(li => li.addEventListener('click', () => {
          searchInput.value = li.textContent;
          state.searchTerm = li.textContent;
          list.hidden = true;
          applyFiltersAndSearch();
        }));
      }

      // Tab switch for visualisation
      qsa('[data-tab]', qs('div[role="tablist"]')).forEach(btn => btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        qsa('[data-tab]', btn.parentNode).forEach(b => b.classList.toggle('border-indigo-600', b === btn));
        qs('#timeline-chart').classList.toggle('hidden', tab !== 'timeline');
        qs('#distribution-chart').classList.toggle('hidden', tab !== 'distribution');
        qs('#network-graph').classList.toggle('hidden', tab !== 'network');
      }));
      // Activate first tab by default
      qs('[data-tab="timeline"]').click();

      // Launch app
      init();
    </script>
  </body>
</html>
