repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m uv run ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: python -m uv run ruff format --check
        language: system
        types: [python]
