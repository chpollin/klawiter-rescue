repos:
  - repo: local
    hooks:
      # ruff is a dev dependency of the project venv; `python -m ruff` works
      # both under `uv run pre-commit` (CI) and locally installed hooks.
      # `python -m uv run ruff` breaks inside uv run: the venv python has no
      # uv module.
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]
